<template>
    <div class="main">
        <div class="display">
            <span v-if="isValidating" class="placeholder system-msg">Waiting...</span>
            <span v-else-if="pin.length > 0" class="mask">{{ pinMask }}</span>
            <span v-else class="placeholder">{{ placeholderText }}</span>
        </div>

        <div class="keypad">
            <button :disabled="isValidating" @click="press('1')">1</button>
            <button :disabled="isValidating" @click="press('2')">2</button>
            <button :disabled="isValidating" @click="press('3')">3</button>

            <button :disabled="isValidating" @click="press('4')">4</button>
            <button :disabled="isValidating" @click="press('5')">5</button>
            <button :disabled="isValidating" @click="press('6')">6</button>

            <button :disabled="isValidating" @click="press('7')">7</button>
            <button :disabled="isValidating" @click="press('8')">8</button>
            <button :disabled="isValidating" @click="press('9')">9</button>

            <button class="btn-clear" :disabled="isValidating" @click="clearPin()">C</button>
            <button :disabled="isValidating" @click="press('0')">0</button>
            <button class="btn-ok" :disabled="isValidating" @click="confirm()">OK</button>
        </div>
    </div>
</template>

<script>
    export default {
    data() {
        return {
            pin: "",
            mode: "normal", // 'normal', 'current_password', 'new_password', 'confirm_password'
            oldPassword: "", 
            tempPassword: "", 
            isValidating: false // Trava a tela enquanto espera o Node-RED
        };
    },
    computed: {
        pinMask() {
            return "*".repeat(this.pin.length);
        },
        placeholderText() {
            if (this.mode === 'normal') return "put your password";
            if (this.mode === 'current_password') return "put old password";
            if (this.mode === 'new_password') return "put new password";
            if (this.mode === 'confirm_password') return "confirm new password";
            return "";
        }
    },
    watch: {
        // Fica escutando as mensagens de volta do Node-RED
        msg: function (newMsg) {
            if (newMsg && newMsg.payload) {
                if (newMsg.payload.action === "update_password_response") {
                    this.isValidating = false; // Destrava a tela
                    
                    if (newMsg.payload.success === true) {
                        alert("Senha alterada com sucesso!");
                    } else {
                        // Caso a senha antiga não bata lá no backend, por exemplo
                        alert("Erro ao alterar: " + (newMsg.payload.message || "Senha antiga incorreta."));
                    }
                    
                    this.resetToNormal();
                }
            }
        }
    },
    methods: {
        press(value) {
            if (this.pin.length < 6) {
                this.pin += value;
            }
        },
        clearPin() {
            if (this.pin === "" && this.mode !== 'normal') {
                this.resetToNormal();
            } else {
                this.pin = "";
            }
        },
        resetToNormal() {
            this.mode = 'normal';
            this.oldPassword = "";
            this.tempPassword = "";
            this.pin = "";
            this.isValidating = false;
        },
        confirm() {
            let uuid = this.generateUUID();
            let dynamicTopic = `IPB/IoT/AlarmProject/Notifications/Personal/${uuid}`;
            
            if (this.pin.length === 0) return;

            if (this.mode === 'normal') {
                if (this.pin === '000000') {
                    this.mode = 'current_password';
                    this.pin = "";
                } else {
                    this.send({ 
                        topic: dynamicTopic,
                        payload: 
                        { 
                            action: "login", 
                            pin: this.pin,
                            uuid: uuid
                        } 
                    });
                    this.pin = "";
                }
            } 
            
            else if (this.mode === 'current_password') {
                this.oldPassword = this.pin;
                this.mode = 'new_password';
                this.pin = "";
            }
            
            else if (this.mode === 'new_password') {
                this.tempPassword = this.pin;
                this.mode = 'confirm_password';
                this.pin = "";
            } 
            
            else if (this.mode === 'confirm_password') {
                if (this.pin === this.tempPassword) {
                    // Ativa a tela de bloqueio "Waiting..."
                    this.isValidating = true;
                    
                    // Envia os dados e NÃO reseta. Fica aguardando a resposta no 'watch'
                    this.send({ 
                        topic: dynamicTopic,
                        payload: { 
                            action: "update_password", 
                            old_password: this.oldPassword,
                            new_password: this.pin,
                            uuid: uuid
                        } 
                    });
                    
                } else {
                    alert("As senhas não coincidem. Digite a nova senha novamente.");
                    this.mode = 'new_password';
                    this.tempPassword = "";
                    this.pin = "";
                }
            }
        },
        generateUUID() {
        // Tenta usar a API nativa do navegador primeiro
        if (window.crypto && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        // Fallback matemático caso esteja rodando em HTTP local sem SSL
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0, 
                  v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
        }
    }
};
</script>
